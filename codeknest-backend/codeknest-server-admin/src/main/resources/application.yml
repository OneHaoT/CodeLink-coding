# ============================================
# CodeLink Admin 应用配置（管理后台独立端口）
# 公共段（datasource / redis / rabbitmq / jackson / mybatis-plus / jwt / upload 公共部分）
# 见 classpath:codeknest-common.yml（common-core），本文件仅保留 admin 特有与差异项
# 敏感信息一律环境变量注入，变量清单见根目录 .env.example
# ============================================
server:
  port: 8081
  servlet:
    context-path: /api

spring:
  config:
    import: classpath:codeknest-common.yml
  application:
    name: codeknest-server-admin

knife4j:
  setting:
    doc-name: CodeLink Admin API

logging:
  level:
    root: INFO
    com.codeknest: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
